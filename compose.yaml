name: friend-on-campus

services:
  web-app:
    build:
      context: .
      dockerfile: web-app/Dockerfile
    environment:
      USER_SERVICE_URL: http://user-service:3001
      SUPPLIER_SERVICE_URL: http://supplier-service:3002
      ORDER_SERVICE_URL: http://order-service:3004
      CREDIT_SERVICE_URL: http://credit-service:3003
    ports:
      - "3000:3000"

  user-service:
    build:
      context: ./user-service

  supplier-service:
    build:
      context: ./supplier-service

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://foc_order:local_order_password@order-db:5432/foc_order
      REDIS_URL: redis://order-redis:6379
      CREDIT_ORDER_SERVICE_TOKEN: ${CREDIT_ORDER_SERVICE_TOKEN:?CREDIT_ORDER_SERVICE_TOKEN must be set}
      USER_SERVICE_URL: ${ORDER_USER_SERVICE_URL:-http://host.docker.internal:3001}
      SUPPLIER_SERVICE_URL: ${ORDER_SUPPLIER_SERVICE_URL:-http://host.docker.internal:3002}
      CREDIT_SERVICE_URL: ${ORDER_CREDIT_SERVICE_URL:-http://host.docker.internal:3003}
    ports:
      - "3004:3004"
    depends_on:
      order-db:
        condition: service_healthy
      order-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3004/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foc_order
      POSTGRES_USER: foc_order
      POSTGRES_PASSWORD: local_order_password
    ports:
      - "5436:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foc_order -d foc_order"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - order-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  credit-service:
    build:
      context: .
      dockerfile: credit-service/Dockerfile
    environment:
      DATABASE_URL: ${CREDIT_DATABASE_URL:-postgresql://foc_credit:local_credit_password@credit-db:5432/foc_credit}
      CREDIT_INITIAL_BALANCE: ${CREDIT_INITIAL_BALANCE:-100}
      CREDIT_TRANSACTION_RETRIES: ${CREDIT_TRANSACTION_RETRIES:-5}
      CREDIT_USER_SERVICE_TOKEN: ${CREDIT_USER_SERVICE_TOKEN:?CREDIT_USER_SERVICE_TOKEN must be set}
      CREDIT_ORDER_SERVICE_TOKEN: ${CREDIT_ORDER_SERVICE_TOKEN:?CREDIT_ORDER_SERVICE_TOKEN must be set}
      CREDIT_MONITORING_TOKEN: ${CREDIT_MONITORING_TOKEN:?CREDIT_MONITORING_TOKEN must be set}
      CREDIT_EVENTS_ENABLED: ${CREDIT_EVENTS_ENABLED:-true}
      CREDIT_EVENTS_QUEUE: ${CREDIT_EVENTS_QUEUE:-credit-service.events}
      CREDIT_EVENTS_EXCHANGE: ${CREDIT_EVENTS_EXCHANGE:-foc.events}
      CREDIT_EVENTS_DEAD_LETTER_EXCHANGE: ${CREDIT_EVENTS_DEAD_LETTER_EXCHANGE:-foc.events.dlx}
      CREDIT_EVENTS_DEAD_LETTER_QUEUE: ${CREDIT_EVENTS_DEAD_LETTER_QUEUE:-credit-service.events.dlq}
      CREDIT_EVENTS_DEAD_LETTER_ROUTING_KEY: ${CREDIT_EVENTS_DEAD_LETTER_ROUTING_KEY:-credit-service.events.dead}
      CREDIT_EVENTS_PREFETCH: ${CREDIT_EVENTS_PREFETCH:-10}
      CREDIT_OUTBOX_POLL_INTERVAL_MS: ${CREDIT_OUTBOX_POLL_INTERVAL_MS:-1000}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://foc:foc_local_password@rabbitmq:5672}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET:?JWT_ACCESS_TOKEN_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-foc-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-foc-api}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      DATABASE_STARTUP_TIMEOUT_SECONDS: ${DATABASE_STARTUP_TIMEOUT_SECONDS:-55}
      DATABASE_RETRY_INTERVAL_SECONDS: ${DATABASE_RETRY_INTERVAL_SECONDS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3003
    ports:
      - "${CREDIT_SERVICE_PORT:-3003}:3003"
    depends_on:
      credit-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3003/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  credit-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${CREDIT_DATABASE_NAME:-foc_credit}
      POSTGRES_USER: ${CREDIT_DATABASE_USER:-foc_credit}
      POSTGRES_PASSWORD: ${CREDIT_DATABASE_PASSWORD:-local_credit_password}
    ports:
      - "${CREDIT_DATABASE_PORT:-5435}:5432"
    volumes:
      - credit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: foc
      RABBITMQ_DEFAULT_PASS: foc_local_password
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  default:
    name: foc-network

volumes:
  order-db-data:
  order-redis-data:
  credit-db-data:
