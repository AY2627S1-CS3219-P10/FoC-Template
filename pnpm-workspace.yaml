packages:
  - "order-service"
  - "credit-service"
  - "web-app"

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  cpu-features: false
  msgpackr-extract: false
  prisma: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/eslint-plugin-next@16.3.6'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - eslint-config-next@16.3.6
  - next@16.3.8

overrides:
  deepmerge-ts@<8.0.0: ^8.0.0
  fastify@<5.12.5: ^5.12.5
  mysql2@<3.22.0: ^3.22.0
  sharp@<0.35.5: ^0.35.5
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
