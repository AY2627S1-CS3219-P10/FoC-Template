name: foc-supplier-service

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foc_supplier}
      POSTGRES_USER: ${POSTGRES_USER:-foc_supplier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foc_supplier_dev}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - supplier-service-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  supplier-service-postgres-data:
